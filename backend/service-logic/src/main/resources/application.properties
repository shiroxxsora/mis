spring.application.name=service-logic

server.port=${SERVER_PORT:8082}
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

recognition.service.url=${RECOGNITION_SERVICE_URL:http://localhost:8083}

management.endpoints.web.exposure.include=health,info

hasura.url=${HASURA_URL:http://hasura-graphql-engine:8080}
hasura.admin-secret=${HASURA_ADMIN_SECRET:changeme}

logging.level.com.mis.servicelogic.client=INFO
logging.level.com.mis.servicelogic.controller=INFO

llm.api-url=${LLM_API_URL:http://host.docker.internal:1234/api/v1/chat}
llm.model=${LLM_MODEL:qwen/qwen3.5-9b}
llm.system-prompt=${LLM_SYSTEM_PROMPT:Ты медицинский ассистент. Отвечай кратко на русском, структурируй вывод: жалобы, динамика, лечение, риски.}
llm.attendance-system-prompt=${LLM_ATTENDANCE_SYSTEM_PROMPT:Ты аналитик стоматологической клиники. По истории записей пациента оцени вероятность его явки на следующий приём. Учитывай количество явок, пропусков и отмен. Ответь только целым числом от 0 до 100 — процент вероятности явки, без пояснений.}
llm.connect-timeout-seconds=${LLM_CONNECT_TIMEOUT_SECONDS:30}
llm.read-timeout-seconds=${LLM_READ_TIMEOUT_SECONDS:600}

mis.attendance-backfill.enabled=${ATTENDANCE_BACKFILL_ENABLED:true}
mis.attendance-backfill.patients-limit=${ATTENDANCE_BACKFILL_PATIENTS_LIMIT:25}
mis.attendance-backfill.appointments-limit=${ATTENDANCE_BACKFILL_APPOINTMENTS_LIMIT:10}

minio.endpoint=${MINIO_ENDPOINT:http://minio:9000}
minio.access-key=${MINIO_ROOT_USER:minioadmin}
minio.secret-key=${MINIO_ROOT_PASSWORD:minioadmin}
minio.bucket=${MINIO_BUCKET:mis-patient-images}
