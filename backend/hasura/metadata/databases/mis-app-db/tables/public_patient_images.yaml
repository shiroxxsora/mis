table:
  name: patient_images
  schema: public
object_relationships:
  - name: patient
    using:
      foreign_key_constraint_on: patient_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - patient_id
        - type
        - taken_at
        - tooth_number
        - notes
        - created_at
      filter: {}
      allow_aggregations: true
