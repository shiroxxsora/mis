table:
  name: referral_directions
  schema: public
array_relationships:
  - name: clinics
    using:
      foreign_key_constraint_on:
        column: direction_id
        table:
          name: referral_clinics
          schema: public
  - name: specialists
    using:
      foreign_key_constraint_on:
        column: direction_id
        table:
          name: referral_specialists
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - code
        - name
        - description
        - is_active
        - created_at
      filter:
        is_active:
          _eq: true
      allow_aggregations: true
