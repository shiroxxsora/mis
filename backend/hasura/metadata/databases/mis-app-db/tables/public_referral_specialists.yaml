table:
  name: referral_specialists
  schema: public
object_relationships:
  - name: direction
    using:
      foreign_key_constraint_on: direction_id
  - name: clinic
    using:
      foreign_key_constraint_on: clinic_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - direction_id
        - clinic_id
        - last_name
        - first_name
        - middle_name
        - position_title
        - is_active
        - created_at
      filter:
        _and:
          - is_active:
              _eq: true
          - clinic:
              is_active:
                _eq: true
              direction:
                is_active:
                  _eq: true
      allow_aggregations: true
